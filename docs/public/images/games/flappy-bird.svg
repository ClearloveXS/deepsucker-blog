<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141225"/>
      <stop offset="0.6" stop-color="#1b1836"/>
      <stop offset="1" stop-color="#241f42"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.75" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ff4d8d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#sky)"/>
  <rect width="400" height="300" fill="url(#glow1)"/>
  <rect width="400" height="300" fill="url(#glow2)"/>

  <circle cx="42" cy="38" r="1.5" fill="#fff" opacity="0.55"/>
  <circle cx="120" cy="70" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="205" cy="30" r="1.3" fill="#fff" opacity="0.5"/>
  <circle cx="330" cy="52" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="370" cy="120" r="1.4" fill="#fff" opacity="0.45"/>
  <circle cx="250" cy="90" r="1" fill="#fff" opacity="0.35"/>

  <!-- 左管道 -->
  <rect x="60" y="0" width="46" height="76" fill="url(#pipe)"/>
  <rect x="55" y="68" width="56" height="14" rx="3" fill="url(#pipe)"/>
  <rect x="55" y="68" width="56" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="60" y="196" width="46" height="74" fill="url(#pipe)"/>
  <rect x="55" y="188" width="56" height="14" rx="3" fill="url(#pipe)"/>
  <rect x="55" y="188" width="56" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>

  <!-- 右管道 -->
  <rect x="292" y="0" width="46" height="118" fill="url(#pipe)"/>
  <rect x="287" y="110" width="56" height="14" rx="3" fill="url(#pipe)"/>
  <rect x="287" y="110" width="56" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="292" y="238" width="46" height="32" fill="url(#pipe)"/>
  <rect x="287" y="230" width="56" height="14" rx="3" fill="url(#pipe)"/>
  <rect x="287" y="230" width="56" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>

  <!-- 地面 -->
  <rect y="270" width="400" height="30" fill="#0e0c1a"/>
  <rect y="270" width="400" height="2" fill="#7c5cff" opacity="0.6"/>

  <!-- 鸟 -->
  <g transform="translate(185 150)">
    <circle r="16" fill="#f8d347"/>
    <ellipse cx="-5" cy="3" rx="8" ry="5" fill="rgba(255,255,255,0.85)" transform="rotate(-15)"/>
    <circle cx="6" cy="-5" r="4.5" fill="#fff"/>
    <circle cx="7.5" cy="-5" r="2" fill="#111"/>
    <path d="M 12 0 L 24 3 L 12 8 Z" fill="#ff9f43"/>
  </g>
</svg>
